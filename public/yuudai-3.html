<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yuudai-3 | Digital Entertainment Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/yuudai-3.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <i class="fas fa-cube"></i>
                <span>yuudai-3</span>
            </div>
            <div class="nav-menu">
                <a href="#home" class="nav-link active" data-section="home">
                    <i class="fas fa-home"></i> ホーム
                </a>
                <a href="#youtube" class="nav-link" data-section="youtube">
                    <i class="fab fa-youtube"></i> YouTube
                </a>
                <a href="#games" class="nav-link" data-section="games">
                    <i class="fas fa-gamepad"></i> ゲーム
                </a>
                <a href="#anime" class="nav-link" data-section="anime">
                    <i class="fas fa-film"></i> アニメ
                </a>
                <a href="#manga" class="nav-link" data-section="manga">
                    <i class="fas fa-book"></i> マンガ
                </a>
            </div>
            <div class="nav-toggle">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section id="home" class="section hero">
        <div class="hero-content">
            <div class="hero-text">
                <h1 class="hero-title">
                    <span class="title-word">Digital</span>
                    <span class="title-word">Entertainment</span>
                    <span class="title-word">Hub</span>
                </h1>
                <p class="hero-subtitle">YouTube・ゲーム・アニメ・マンガが一つに</p>
            </div>
            <div class="hero-buttons">
                <button class="btn btn-primary" onclick="scrollToSection('youtube')">
                    <span>今すぐ開始</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
                <button class="btn btn-secondary" onclick="alert('機能詳細はこちら')">
                    <span>詳細を見る</span>
                    <i class="fas fa-info-circle"></i>
                </button>
            </div>
        </div>
        <div class="hero-grid">
            <div class="grid-item" style="--i: 0;"><i class="fab fa-youtube"></i></div>
            <div class="grid-item" style="--i: 1;"><i class="fas fa-gamepad"></i></div>
            <div class="grid-item" style="--i: 2;"><i class="fas fa-film"></i></div>
            <div class="grid-item" style="--i: 3;"><i class="fas fa-book"></i></div>
        </div>
    </section>

    <!-- YouTube Section -->
    <section id="youtube" class="section content-section">
        <div class="section-header">
            <h2>YouTube</h2>
            <p>お気に入りの動画を検索・視聴</p>
        </div>
        <div class="youtube-container">
            <div class="search-box frosted-glass">
                <input type="text" id="youtubeSearch" placeholder="動画を検索..." class="search-input">
                <button class="search-btn" onclick="searchYoutube()">
                    <i class="fas fa-search"></i>
                </button>
            </div>
            <div id="youtubeResults" class="video-grid"></div>
        </div>
    </section>

    <!-- Games Section -->
    <section id="games" class="section content-section">
        <div class="section-header">
            <h2>ゲーム</h2>
            <p>人気ゲームをブラウザで遊ぶ</p>
        </div>
        <div class="games-grid" id="gamesGrid"></div>
    </section>

    <!-- Anime Section -->
    <section id="anime" class="section content-section">
        <div class="section-header">
            <h2>アニメ</h2>
            <p>最新アニメを視聴</p>
        </div>
        <div class="content-grid" id="animeGrid"></div>
    </section>

    <!-- Manga Section -->
    <section id="manga" class="section content-section">
        <div class="section-header">
            <h2>マンガ</h2>
            <p>人気マンガを読む</p>
        </div>
        <div class="content-grid" id="mangaGrid"></div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2024 yuudai-3 | Digital Entertainment Hub</p>
            <div class="footer-links">
                <a href="#" class="footer-link">プライバシー</a>
                <a href="#" class="footer-link">利用規約</a>
                <a href="#" class="footer-link">お問い合わせ</a>
            </div>
        </div>
    </footer>

    <script src="/js/yuudai-3.js"></script>
</body>
</html>
